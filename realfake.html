<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Real or Fake · Layer8</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%231d4f7c'/%3E%3Cpath d='M10 16.5l4 4 8-9' fill='none' stroke='%23e8b931' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="tiles"></div>

  <header class="topbar">
    <a class="topbar__back" href="index.html">← Games</a>
    <h1 class="topbar__title">Real or Fake</h1>
    <div class="topbar__spacer"></div>
    <span class="chip" id="roundChip">Round —</span>
    <span class="chip" id="timeChip">⏱ 10</span>
    <button class="icon-btn" id="muteBtn" type="button"></button>
  </header>

  <main class="rf">
    <!-- start screen -->
    <section class="rf-start" id="startScreen">
      <div class="arch">
        <h2 style="font-size:40px;color:var(--aegean-deep)">Spot the real one</h2>
        <p>Each round shows two logos or two website links. One is real, one is a fake.
           The player has <strong>10 seconds</strong> to point at the real one.</p>
        <button class="btn btn--primary" id="startBtn" type="button">Start</button>
      </div>
    </section>

    <!-- game -->
    <section class="hidden" id="game" style="display:contents">
      <div class="rf-timebar" id="timebar" data-level="ok"><div class="rf-timebar__fill" id="timebarFill"></div></div>

      <div class="rf-prompt">
        <div class="rf-prompt__kicker" id="kicker">Logo challenge</div>
        <h2 id="question">Which one is real?</h2>
      </div>

      <div class="rf-options" id="options"></div>

      <div class="rf-footer">
        <div class="rf-result" id="result"></div>
        <button class="btn btn--primary hidden" id="nextBtn" type="button">Next →</button>
      </div>
      <div class="kbd-help">Operator keys: <kbd>1</kbd>/<kbd>←</kbd> left · <kbd>2</kbd>/<kbd>→</kbd> right · <kbd>Enter</kbd> next</div>
    </section>
  </main>

  <script src="js/common.js"></script>
  <script src="js/logos.js"></script>
  <script src="js/urls.js"></script>
  <script src="js/realfake.js"></script>
</body>
</html>
